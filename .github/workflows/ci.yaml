name: CI

on:
    push:
        branches: [master]
    pull_request: ~

jobs:
    analyse:
        name: "Static analysis (PHP ${{ matrix.php }})"
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4', '8.5']
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '${{ matrix.php }}'
                  coverage: none
                  tools: composer:v2
            - run: composer install --no-interaction --prefer-dist
            - run: vendor/bin/ecs check
            - run: vendor/bin/phpstan analyse --no-progress

    tests:
        name: "Tests (PHP ${{ matrix.php }}, ${{ matrix.database }})"
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4', '8.5']
                database: ['postgres', 'mysql']
        env:
            DATABASE_URL: >-
                ${{ matrix.database == 'postgres'
                && 'postgresql://postgres:postgres@127.0.0.1:5432/test?serverVersion=16&charset=utf8'
                || 'mysql://root:root@127.0.0.1:3306/test?serverVersion=8.4&charset=utf8mb4' }}
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: test
                ports: ['5432:5432']
                options: >-
                    --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: test
                ports: ['3306:3306']
                options: >-
                    --health-cmd "mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 5
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '${{ matrix.php }}'
                  coverage: none
                  tools: composer:v2
            - run: composer install --no-interaction --prefer-dist
            - run: vendor/bin/phpunit
