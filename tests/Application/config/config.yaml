doctrine:
    orm:
        enable_native_lazy_objects: true
        mappings:
            SyliusClassificationTestApplication:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/../../../tests/Application/src/Entity'
                prefix: 'FluffyDiscord\SyliusClassificationBundle\Tests\Application\Entity'
                alias: SyliusClassificationTestApplication

sylius_product:
    resources:
        product_variant:
            classes:
                model: FluffyDiscord\SyliusClassificationBundle\Tests\Application\Entity\ProductVariant
