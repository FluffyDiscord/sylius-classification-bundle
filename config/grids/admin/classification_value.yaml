sylius_grid:
    grids:
        sylius_classification_admin_classification_value:
            driver:
                name: doctrine/orm
                options:
                    class: "%sylius_classification.model.classification_value.class%"
            sorting:
                position: asc
                code: asc
            fields:
                position:
                    type: string
                    label: sylius.ui.position
                    sortable: ~
                code:
                    type: string
                    label: sylius.ui.code
                    sortable: ~
                name:
                    type: string
                    label: sylius.ui.name
            filters:
                search:
                    type: string
                    label: sylius.ui.search
                    options:
                        fields: [code]
                    form_options:
                        type: !php/const Sylius\Component\Grid\Filter\StringFilter::TYPE_CONTAINS
                classification:
                    type: entity
                    label: sylius_classification.ui.classification
                    form_options:
                        class: "%sylius_classification.model.classification.class%"
                        choice_label: code
                        autocomplete: true
                    options:
                        fields: [classification.id]
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    delete:
                        type: delete
                bulk:
                    delete:
                        type: delete
