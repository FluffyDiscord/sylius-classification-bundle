sylius_grid:
    grids:
        sylius_classification_admin_classification:
            driver:
                name: doctrine/orm
                options:
                    class: "%sylius_classification.model.classification.class%"
            sorting:
                position: asc
            fields:
                position:
                    type: string
                    label: sylius.ui.position
                    sortable: ~
                code:
                    type: string
                    label: sylius.ui.code
                    sortable: ~
                name:
                    type: string
                    label: sylius.ui.name
                multiple:
                    type: twig
                    label: sylius_classification.ui.multiple
                    options:
                        template: "@SyliusAdmin/shared/grid/field/boolean.html.twig"
                        vars:
                            th_class: "text-center"
            filters:
                search:
                    type: string
                    label: sylius.ui.search
                    options:
                        fields: [code]
                    form_options:
                        type: !php/const Sylius\Component\Grid\Filter\StringFilter::TYPE_CONTAINS
            actions:
                main:
                    create:
                        type: create
                item:
                    show_values:
                        type: show
                        label: sylius_classification.ui.show_values
                        icon: 'tabler:list-details'
                        options:
                            link:
                                route: sylius_classification_admin_classification_value_index
                                parameters:
                                    'criteria[classification]': resource.id
                    update:
                        type: update
                    delete:
                        type: delete
                bulk:
                    delete:
                        type: delete
