sylius_twig_hooks:
    hooks:
        'sylius_classification.admin.classification_value.create.content':
            form:
                component: 'sylius_classification:admin:classification_value:form'
                props:
                    resource: '@=_context.resource'
                    form: '@=_context.form'
                    template: '@SyliusAdmin/shared/crud/common/content/form.html.twig'
                configuration:
                    render_rest: false
                priority: 0

        'sylius_classification.admin.classification_value.update.content':
            form:
                component: 'sylius_classification:admin:classification_value:form'
                props:
                    resource: '@=_context.resource'
                    form: '@=_context.form'
                    template: '@SyliusAdmin/shared/crud/common/content/form.html.twig'
                configuration:
                    render_rest: false
                priority: 0

        'sylius_classification.admin.classification_value.create.content.form':
            sections:
                template: '@SyliusClassification/admin/classification_value/form/sections.html.twig'
                priority: 0

        'sylius_classification.admin.classification_value.update.content.form':
            sections:
                template: '@SyliusClassification/admin/classification_value/form/sections.html.twig'
                priority: 0

        'sylius_classification.admin.classification_value.create.content.form.sections':
            general:
                template: '@SyliusClassification/admin/classification_value/form/sections/general.html.twig'
                priority: 200
            translations:
                template: '@SyliusClassification/admin/classification_value/form/sections/translations.html.twig'
                priority: 100

        'sylius_classification.admin.classification_value.update.content.form.sections':
            general:
                template: '@SyliusClassification/admin/classification_value/form/sections/general.html.twig'
                priority: 200
            translations:
                template: '@SyliusClassification/admin/classification_value/form/sections/translations.html.twig'
                priority: 100
